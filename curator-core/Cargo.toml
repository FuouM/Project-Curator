[package]
name = "curator-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
regex = "1.11"
regex-automata = "0.4"
aho-corasick = "1"
futures-util = "0.3"
usearch = "2"
image = "0.25"
fast_image_resize = "5"
turbojpeg = "1"
png = { version = "0.18", features = ["zlib-rs"] }
ndarray = "0.17"
ureq = "3"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native", "directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native", "coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native", "cuda", "rocm"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "linux")))'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native"] }

[dev-dependencies]
tempfile = "3"
