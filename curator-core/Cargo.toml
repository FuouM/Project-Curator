[package]
name = "curator-core"
version = "0.1.0"
edition = "2024"

[dependencies]
curator-proto = { path = "../curator-proto" }
curator-filename-parser = { path = "../curator-filename-parser" }
curator-media = { path = "../curator-media" }
curator-db = { path = "../curator-db" }
curator-ml = { path = "../curator-ml" }
tokio = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
image = { workspace = true }
fast_image_resize = { workspace = true }
turbojpeg = { workspace = true }
png = { workspace = true }
webp = { workspace = true }

# Align workspace dependency features to prevent cache invalidation between target compilation graphs
tokio-stream = { workspace = true }
url = { workspace = true }
bitflags = { workspace = true }
indexmap = { workspace = true }
stable_deref_trait = { workspace = true }
bit-set = { workspace = true }
foldhash = { workspace = true }
percent-encoding = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
hyper-util = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"
ndarray = "0.17"
ort = { workspace = true, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native", "half", "directml"] }