[package]
name = "curator-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
curator-core = { path = "../curator-core" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
tonic = { version = "0.12", features = ["transport"] }

