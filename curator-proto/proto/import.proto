syntax = "proto3";

package curator.import;

import "google/protobuf/empty.proto";
import "common.proto";

service ImportService {
  rpc ImportImage (ImportImageRequest) returns (ImportResult);
  rpc GetImportProgress (google.protobuf.Empty) returns (ImportProgress);
  rpc CancelImport (google.protobuf.Empty) returns (CancelImportResult);
  rpc GetImportedFolders (google.protobuf.Empty) returns (ImportedFoldersResult);
  rpc BackfillImageFolders (google.protobuf.Empty) returns (BackfillResult);
  rpc BackfillMediaMetadata (google.protobuf.Empty) returns (MediaMetadataBackfillResult);
  rpc RescanFolder (RescanFolderRequest) returns (RescanFolderResult);
  rpc IndexFolder (IndexFolderRequest) returns (IndexFolderResult);
  rpc RescanSafety (google.protobuf.Empty) returns (RescanSafetyResult);
  rpc GetSafetyRescanProgress (google.protobuf.Empty) returns (SafetyRescanProgress);
  rpc EphemeralClassifySafety (EphemeralClassifySafetyRequest) returns (EphemeralClassifySafetyResult);
}

message ImportProgress {
  bool running = 1;
  string phase = 2; // "idle" | "discovering" | "extracting" | "writing_db" | "complete" | "cancelled" | "failed"
  int64 discovered_files = 3;
  int64 processed_files = 4;
  int64 total_files = 5;
  string current_file = 6;
  string error_message = 7;
}

message CancelImportResult {
  bool success = 1;
  string message = 2;
}

message ImportImageRequest {
  string path = 1;
  repeated string paths = 2;
}

message ImportResult {
  int64 image_id = 1;
  string sha256 = 2;
  uint32 imported_count = 3;
  optional int64 folder_id = 4;
  repeated int64 folder_ids = 5;
}



message ImportedFoldersResult {
  repeated curator.common.FolderDetails folders = 1;
}

message BackfillResult {
  int64 images_backfilled = 1;
}

message MediaMetadataBackfillResult {
  int64 processed = 1;
  int64 updated = 2;
}

message RescanFolderRequest {
  int64 folder_id = 1;
}

message RescanFolderResult {
  int64 folder_id = 1;
  // New files imported by the rescan (0 when everything was already known).
  int64 imported = 2;
  // Total supported media files found in the folder during the scan.
  int64 found = 3;
}

message IndexFolderRequest {
  int64 folder_id = 1;
}

message IndexFolderResult {
  int64 folder_id = 1;
  // Media files newly queued for vectorization.
  int64 queued = 2;
}

message RescanSafetyResult {
  bool started = 1;   // false when a rescan is already running
  int64 pending = 2;  // images queued for classification
  string message = 3;
}

message SafetyRescanProgress {
  bool running = 1;
  int64 processed = 2;
  int64 total = 3;
  int64 updated = 4;  // rows whose per-class scores changed
  string status = 5;  // "idle" | "scanning" | "complete" | "failed"
}

// Ephemeral (library-agnostic) safety classification of an arbitrary image
// file, used by the Image Toolbox. Nothing is written to the database.
message EphemeralClassifySafetyRequest {
  string path = 1;
}

message EphemeralClassifySafetyResult {
  string path = 1;
  // Per-class content-safety probabilities (nsfw-detection-2-mini softmax).
  // Always present on success; the browser derives NSFW/SFW aggregates.
  optional float safe_score = 2;    // softmax[0]
  optional float hentai_score = 3;  // softmax[1]
  optional float porn_score = 4;    // softmax[2]
  optional float sexy_score = 5;    // softmax[3]
  optional float drawing_score = 6; // softmax[4]
}
