syntax = "proto3";

package curator.folders;

import "google/protobuf/empty.proto";
import "common.proto";

service FoldersService {
  rpc GetStorageStats (google.protobuf.Empty) returns (StorageStatsResult);
  rpc UpdateFolderPath (UpdateFolderPathRequest) returns (UpdateFolderPathResult);
  rpc DeleteFolder (DeleteFolderRequest) returns (DeleteFolderResult);
  rpc DetectDuplicateFolders (google.protobuf.Empty) returns (DuplicateFoldersResult);
  rpc MergeFolders (MergeFoldersRequest) returns (MergeFoldersResult);
}

message StorageStatsResult {
  curator.common.StorageStats stats = 1;
}

message UpdateFolderPathRequest {
  int64 id = 1;
  string new_path = 2;
}

message UpdateFolderPathResult {
  bool success = 1;
}

message DeleteFolderRequest {
  int64 id = 1;
}

message DeleteFolderResult {
  bool success = 1;
}

message DuplicateFoldersResult {
  repeated curator.common.DuplicateFolderGroup groups = 1;
}

message MergeFoldersRequest {
  int64 keep_folder_id = 1;
  int64 merge_folder_id = 2;
}

message MergeFoldersResult {
  bool success = 1;
  int64 images_moved = 2;
}
