[workspace]
members = [
    "curator-core",
    "curator-service",
    "curator-cli",
    "curator-dashboard/src-tauri",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
tonic = { version = "0.12", features = ["transport"] }
prost = "0.13"
ureq = "3"

[profile.dev]
opt-level = 0
debug = 1
incremental = false





[profile.dev.package."fast_image_resize"]
opt-level = 3

[profile.dev.package."image"]
opt-level = 3

[profile.dev.package."libwebp-sys"]
opt-level = 3

[profile.dev.package."webp"]
opt-level = 3

[profile.dev.package."png"]
opt-level = 3

[profile.dev.package."turbojpeg"]
opt-level = 3

[profile.dev.package."turbojpeg-sys"]
opt-level = 3

# The `image` crate dispatches to these decoder crates internally. They are the hot
# paths (zune-jpeg, image-webp, gif, png inflate, tiff) and must be opt-level 3 so
# dev-mode decoding reaches release-class speeds. Without this, dev thumbnails/
# previews are 10-47x slower and the benchmark winners flip to the native backends.
[profile.dev.package."zune-jpeg"]
opt-level = 3

[profile.dev.package."zune-core"]
opt-level = 3

[profile.dev.package."image-webp"]
opt-level = 3

[profile.dev.package."gif"]
opt-level = 3

[profile.dev.package."weezl"]
opt-level = 3

[profile.dev.package."tiff"]
opt-level = 3

[profile.dev.package."fax"]
opt-level = 3

[profile.dev.package."exr"]
opt-level = 3

[profile.dev.package."flate2"]
opt-level = 3

[profile.dev.package."miniz_oxide"]
opt-level = 3

[profile.dev.package."zlib-rs"]
opt-level = 3

[profile.dev.package."fdeflate"]
opt-level = 3

[profile.dev.package."crc32fast"]
opt-level = 3

[profile.dev.package."ndarray"]
opt-level = 3

[profile.dev.package."curator-core"]
opt-level = 3

[profile.dev.package."ort"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
