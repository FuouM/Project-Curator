[workspace]
members = [
    "curator-core",
    "curator-service",
    "curator-cli",
    "curator-dashboard/src-tauri",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid"] }
tonic = { version = "0.12", features = ["transport"] }
ureq = "3"

[profile.dev]
opt-level = 0

[profile.dev.package."fast_image_resize"]
opt-level = 3

[profile.dev.package."image"]
opt-level = 3

[profile.dev.package."libwebp-sys"]
opt-level = 3

[profile.dev.package."webp"]
opt-level = 3

[profile.dev.package."png"]
opt-level = 3

[profile.dev.package."turbojpeg"]
opt-level = 3

[profile.dev.package."turbojpeg-sys"]
opt-level = 3

[profile.dev.package."ndarray"]
opt-level = 3

[profile.dev.package."ort"]
opt-level = 2

[profile.dev.package."curator-core"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
