[package]
name = "curator-ml"
version = "0.1.0"
edition = "2024"

[dependencies]
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
image = "0.25"
webp = "0.3"
fast_image_resize = "5"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
half = "2"
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
curator-proto = { path = "../curator-proto" }
curator-media = { path = "../curator-media" }
curator-db = { path = "../curator-db" }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native", "half", "directml"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native", "half", "coreml"] }

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native", "half", "cuda", "rocm"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos", target_os = "linux")))'.dependencies]
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "copy-dylibs", "download-binaries", "tls-native", "half"] }
